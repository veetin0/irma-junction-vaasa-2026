<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/map.css"></head>
<body><main class="page" id="app" style="display:block"></main>
<script src="/static/map.js"></script>
<script>
const params = new URLSearchParams(location.search); let LANG = params.get("lang") || "en";
async function api(p, m, b) { const r = await fetch(p, { method: m || "GET", headers: b ? { "Content-Type": "application/json" } : undefined, body: b ? JSON.stringify(b) : undefined }); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status); return r.json(); }
let STATE;
async function reload() { STATE = await api("/api/state"); draw(); }
function draw() { window.renderSignalMap(document.getElementById("app"), { state: STATE, lang: LANG, t: (k) => k, api, reload }); }
reload();
</script></body></html>
